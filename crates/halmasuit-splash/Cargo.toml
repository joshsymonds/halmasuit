[package]
name        = "halmasuit-splash"
description = "halmasuit's system background: a wlr-layer-shell BACKGROUND wl_client that renders a configured PNG fullscreen via wgpu. Image source from HALMASUIT_SPLASH_IMAGE."

version.workspace        = true
edition.workspace        = true
license.workspace        = true
repository.workspace     = true
authors.workspace        = true

# Built via nixpkgs's pinned rustc; a looser MSRV than the workspace
# pin is fine (same rationale as the other client crates).
rust-version       = "1.87"

[lints]
workspace = true

[dependencies]
anyhow                 = "1"
smithay-client-toolkit = "0.20"
# Pulls in the system libwayland backend (feature `dlopen`) so the
# raw wl_display/wl_surface pointers exist for wgpu; also used
# directly for the `Proxy::id()` pointer access.
wayland-client.workspace      = true
wgpu.workspace                = true
raw-window-handle.workspace   = true
image.workspace               = true
pollster.workspace            = true
