[package]
name        = "halmasuit"
description = "Linux system compositor (binary)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
halmasuit-introspect = { path = "../halmasuit-introspect", version = "0.1" }
# greetd-protocol server building blocks: Listener, Connection,
# PamSessionFactory. Compositor binds the socket and drives the
# per-connection state machine from calloop callbacks.
halmasuit-greetd     = { path = "../halmasuit-greetd",     version = "0.1" }
# PAM FFI quarantine: the PamSessionFactory impl in this binary
# returns a PamThread for each accepted greeter session.
halmasuit-pam        = { path = "../halmasuit-pam",        version = "0.1" }
tracing.workspace            = true
tracing-subscriber.workspace = true
# smithay carries Wayland-server protocol state. `wayland_frontend` is
# the minimum feature for the Wayland-server protocol surface.
smithay = { workspace = true, features = ["wayland_frontend"] }
# calloop comes in two ways: (1) via smithay's reexport for general
# event-loop use, (2) directly here for the `signals` feature smithay
# doesn't enable. Cargo unifies to one version with merged features.
calloop.workspace            = true
# nix features used by halmasuit:
# - `user`: getuid, setresuid, setresgid for the privilege drop path
# - `ioctl`: the `ioctl_none!` macro that generates the DRM_IOCTL_SET_MASTER wrapper
# - `signal`: sigprocmask in the greeter pre_exec closure (the parent
#   blocks SIGTERM/SIGINT for calloop's signalfd; the greeter child
#   needs the default mask restored before execve)
# - `process`: waitpid in the SIGCHLD reaper so dead greeter / session
#   children don't accumulate as zombies
nix = { workspace = true, features = ["user", "ioctl", "signal", "process"] }
# DRM-rs (v0.15) — typed wrappers around DRM master acquisition,
# resource enumeration, dumb-buffer allocation, and SETCRTC. Used by
# the `drm` submodule. Same pin as drm-master-probe and
# halmasuit-visual-test-standin so the workspace shares one drm-rs
# version.
drm = "0.15"
# Linux capabilities for drop_privileges' CAP_KILL preservation —
# halmasuit must retain signal authority over its greeter child
# (uid 999) post-deprivilege to uid 998. Pure-Rust over libc.
caps.workspace = true
# libc for raw syscall wrappers: pidfd_open / pidfd_send_signal
# (the race-free signal path against the greeter), capset (single-
# call permitted+effective={CAP_KILL} that the `caps` crate's
# high-level API doesn't expose).
libc.workspace = true

[dev-dependencies]
nix        = { workspace = true, features = ["signal", "user", "ioctl", "process"] }
serde_json.workspace = true
tempfile.workspace   = true
