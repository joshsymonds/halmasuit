[package]
name        = "halmasuit-spawn"
description = "Setuid-root privilege-drop helper for halmasuit. Microscopic, audited, no unsafe code."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
# user gates setresuid/setresgid/initgroups/setgroups/geteuid; process
# gates execve + prctl::set_no_new_privs. Nothing else.
nix = { workspace = true, features = ["user", "process"] }

[dev-dependencies]
proptest.workspace = true
