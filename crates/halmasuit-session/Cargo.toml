[package]
name        = "halmasuit-session"
description = "Privileged PAM-lifecycle broker for halmasuit (unified session/pamd epic). This slice: SOCK_SEQPACKET framed transport + SO_PEERCRED peer primitive. No PAM yet."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

# The socket-activated privileged broker binary (Epic R6). The library
# is the API surface + the sole libpam/unsafe quarantine; this bin is
# pure composition (#![forbid(unsafe_code)] in the file).
[[bin]]
name = "halmasuit-session"
path = "src/bin/halmasuit-session.rs"

[dependencies]
# The frozen wire contract this transport carries.
halmasuit-session-ipc = { path = "../halmasuit-session-ipc", version = "0.1" }
# socketpair / send / recv / getsockopt(SO_PEERCRED) and getuid, all
# via nix's safe wrappers so this crate stays #![forbid(unsafe_code)]
# (same posture as halmasuit-greetd's SO_PEERCRED path).
# socket+user: transport/SO_PEERCRED. process: fork/waitpid for the
# ephemeral auth worker (Epic R4). signal: child signal-mask reset
# (memory project-pre-exec-signal-mask) + SIGKILL-no-grace test.
# resource: setrlimit bound on the disposable auth child (R4).
nix                  = { workspace = true, features = ["socket", "user", "process", "signal", "resource", "fs"] }
# The Epic-R6 / Amendment-A2 broker event loop: ONE loop multiplexing
# the systemd listener fd + the in-flight worker + the greeter + an
# idle-exit timer (so evict-old is reachable and "no standing root when
# idle" holds). Same workspace pin as smithay's calloop reexport; the
# "signals" feature drives the SIGTERM/SIGINT clean-stop source.
calloop              = { workspace = true }
thiserror.workspace  = true
# Trait bounds for the generic framed send/recv (same as the codec in
# halmasuit-session-ipc). Pure data traits — no I/O.
serde.workspace      = true
# libpam FFI (pam_ffi module only). This crate is the SOLE libpam-
# linking surface in the workspace (Epic #1 R2/R14) and halmasuit-pam's
# successor. Same pins/rationale as halmasuit-pam's FFI (see CLAUDE.md
# "Ecosystem caveats": pam-sys is a de-facto-stable pre-release).
pam-sys              = { workspace = true }
libc.workspace       = true
# Wipe credential buffers handed to libpam immediately after strdup
# copies them into PAM-owned memory (Epic #1 R11).
zeroize.workspace    = true
