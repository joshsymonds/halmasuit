[package]
name        = "halmasuit-greetd"
description = "greetd wire-protocol state machine + PAM glue for halmasuit. Pure logic; I/O lands separately."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
# Wire types are defined locally (see src/lib.rs) so the binary stays
# permissive-licensed; serde drives the JSON shape that matches the
# upstream greetd protocol spec.
serde.workspace      = true
thiserror.workspace  = true

[dev-dependencies]
proptest.workspace   = true
# Round-trip the wire format against canonical JSON in tests, pinning
# the shape to the protocol spec.
serde_json.workspace = true
