[package]
name        = "halmasuit-greetd"
description = "greetd wire-protocol state machine + PAM glue for halmasuit. Pure logic; I/O lands separately."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
# Wire types are defined locally (see src/lib.rs) so the binary stays
# permissive-licensed; serde drives the JSON shape that matches the
# upstream greetd protocol spec.
serde.workspace      = true
# Codec runtime: encode/decode messages on the greetd socket.
serde_json.workspace = true
thiserror.workspace  = true
# Unix socket peer-credential lookup (SO_PEERCRED via nix wrappers,
# so this crate stays #![forbid(unsafe_code)]).
nix                  = { workspace = true, features = ["socket", "user"] }
# Wipe Connection::read_buf on drop so plaintext credentials
# (PostAuthMessageResponse bodies) don't linger in heap memory.
zeroize.workspace    = true

[dev-dependencies]
proptest.workspace   = true
tempfile.workspace   = true
