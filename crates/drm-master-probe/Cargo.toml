[package]
name        = "drm-master-probe"
description = "Research probe: validate userspace DRM master persistence from rootfs boot to multi-user.target. Phase 0 of halmasuit v2 de-risking. Not production code; halmasuit-kms is the v2 home for DRM ownership."

version.workspace = true
edition.workspace = true
# rust-version intentionally NOT inherited from the workspace (1.95). The
# probe is research scaffolding built via nixpkgs's pinned rustc, which is
# currently 1.94.1 on nixpkgs-unstable. The looser MSRV is a probe-specific
# relaxation, not a workspace-wide concession. Production crates
# (halmasuit-*) keep the 1.95 minimum. Highest feature used: `is_multiple_of`
# stabilized in 1.87.
rust-version       = "1.87"
license.workspace  = true
repository.workspace = true
authors.workspace  = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
drm    = "0.15"
# Phase 1: setresuid for the privilege-drop step post-switch_root. The
# `user` feature gates nix::unistd::{Uid, setresuid}.
nix    = { version = "0.30", features = ["user"] }
# Phase 1 diagnostic instrumentation: dup2 for stderr-redirect to a file
# in /run (so writes don't depend on journald's stderr pipe surviving
# switch_root), and signal() for installing async-signal-safe handlers
# that log which signal killed the process before exiting via _exit().
libc   = "0.2"
