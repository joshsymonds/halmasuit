# cargo-deny configuration. Run via `cargo deny check` (or `just lint`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version             = 2
yanked              = "deny"
# RustSec advisory IDs to ignore (with written justification).
ignore = [
    # paste 1.0.15 — "no longer maintained". Pulled transitively by
    # rsmpeg → bon-macros (Epic #12 video decoder). `paste` is a
    # proc-macro for token pasting whose function (turning identifier
    # fragments into a single ident) is feature-complete; the
    # "unmaintained" status means the upstream repo went unattended,
    # not that the existing version is broken. No CVE, no behavior
    # change. Remove when bon-macros drops the dep upstream OR rsmpeg
    # gains a `paste`-free path.
    { id = "RUSTSEC-2024-0436", reason = "feature-complete proc-macro; transitive via rsmpeg→bon-macros (Epic #12)" },
]

[licenses]
version    = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",  # file-level copyleft is acceptable for halmasuit; flag if a problem emerges.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"   # workspace will accumulate duplicates; tighten later.
wildcards         = "deny"   # no version = "*" in dependency specs.
deny              = []       # explicit per-crate bans (none yet).

[sources]
unknown-registry = "deny"
unknown-git      = "warn"
allow-git        = []
