# cargo-deny configuration. Run via `cargo deny check` (or `just lint`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version             = 2
yanked              = "deny"
# RustSec advisory IDs to ignore (with written justification).
ignore = [
  # RUSTSEC-2024-0436: `paste` is unmaintained (NOT a vulnerability —
  # the author archived it; no security defect). It is a build-time
  # proc-macro with zero runtime/attack surface, pulled transitively
  # by wgpu/naga and reached ONLY by the `halmasuit-splash` client
  # crate — never by the `halmasuit` compositor binary or
  # halmasuit-spawn. No drop-in replacement is wired through
  # wgpu/naga upstream yet. Re-evaluate when wgpu drops the dep.
  "RUSTSEC-2024-0436",
]

[licenses]
version    = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",  # file-level copyleft is acceptable for halmasuit; flag if a problem emerges.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"   # workspace will accumulate duplicates; tighten later.
wildcards         = "deny"   # no version = "*" in dependency specs.
deny              = []       # explicit per-crate bans (none yet).

[sources]
unknown-registry = "deny"
unknown-git      = "warn"
allow-git        = []
