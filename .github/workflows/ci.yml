name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to commit SHAs (not mutable tags) to bound
      # supply-chain blast radius. Refresh by replacing the SHA and
      # noting the corresponding upstream version in the comment.

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5    # v4

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72    # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            substituters = https://cache.nixos.org https://joshsymonds.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= joshsymonds.cachix.org-1:DajO7Bjk/Q8eQVZQZC/AWOzdUst2TGp8fHS/B1pua2c=

      # joshsymonds is a public cache shared across all my flakes — niri/DMS/
      # nixpkgs derivations from gnomon's `update` runs land here and CI
      # benefits without any auth. We never push from CI, so no token.
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc    # v15
        with:
          name: joshsymonds
        continue-on-error: true

      # Cache Rust toolchain + cargo registry + build artifacts. Currently
      # mostly empty (v1 workspace has zero deps), but cheap to wire in now
      # so future v2 builds don't start from scratch on every CI run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830    # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint + unit gate (must pass)
        run: nix develop --command just check

      - name: Smoke test (must pass)
        run: nix build .#checks.x86_64-linux.smoke-boot -L --print-build-logs --no-link

      - name: Flash detection (expected RED until halmasuit v2)
        id: flash-test
        continue-on-error: true
        run: |
          if nix build .#checks.x86_64-linux.login-flash -L --print-build-logs --no-link 2>&1 | tee /tmp/flash.log; then
            echo "result=unexpected-pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=expected-fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Interpret flash result
        run: |
          case "${{ steps.flash-test.outputs.result }}" in
            expected-fail)
              echo "::notice::v1 baseline OK — flash detected as expected. v2 (halmasuit) will make this go green." ;;
            unexpected-pass)
              echo "::error::login-flash unexpectedly PASSED. Either the flash is gone (great, advance to v2!) or the test is broken (audit before celebrating)."
              exit 1 ;;
            *)
              echo "::error::flash-test step produced no result"; exit 1 ;;
          esac

      # Only the v1 flash-detection log is useful as a CI artifact today
      # (smoke-boot passes; failures there mean the framework broke, not
      # the system under test). Once v2 lands and we have visual frame
      # captures, expand this list.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02    # v4
        if: failure()
        with:
          name: vm-test-artifacts
          path: |
            /tmp/flash.log
          if-no-files-found: ignore
          retention-days: 7
