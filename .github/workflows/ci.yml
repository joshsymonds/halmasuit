name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # NOTE: Replace `halmasuit` with the actual cachix cache name once it's
      # created. The CACHIX_AUTH_TOKEN secret must be set in the repo's
      # GitHub Actions secrets for cache writes to work.
      - uses: cachix/cachix-action@v15
        with:
          name: halmasuit
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true   # cache misses must not fail the build.

      - name: nix flake check
        run: nix flake check -L --print-build-logs

      - name: just check
        run: nix develop --command just check

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-artifacts
          path: |
            result*
            target/
          if-no-files-found: ignore
          retention-days: 7
