name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            substituters = https://cache.nixos.org https://joshsymonds.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= joshsymonds.cachix.org-1:DajO7Bjk/Q8eQVZQZC/AWOzdUst2TGp8fHS/B1pua2c=

      # joshsymonds is a public cache shared across all my flakes — niri/DMS/
      # nixpkgs derivations from gnomon's `update` runs land here and CI
      # benefits without any auth. The authToken is only needed if CI itself
      # should *push* builds back into the cache; we skip that for v1 and
      # let gnomon be the sole writer.
      - uses: cachix/cachix-action@v15
        with:
          name: joshsymonds
          # authToken left unset — read-only access works without a token
          # because the cache is public.
        continue-on-error: true

      - name: nix flake check
        run: nix flake check -L --print-build-logs

      - name: just check
        run: nix develop --command just check

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-artifacts
          path: |
            result*
            target/
          if-no-files-found: ignore
          retention-days: 7
