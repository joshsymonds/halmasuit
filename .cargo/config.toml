# Workspace cargo config.
#
# `[env]` makes `cargo` set environment variables for every build
# command at this workspace, so dev workflows (cargo build / test /
# nextest) match the production flake build's behavior — both use
# the checked-in pre-generated ffmpeg bindings instead of running
# bindgen at build time (Epic #12 task #28 / Epic #5 commitment:
# no libclang at production build time, no clang-sys feature-
# unification conflict with halmasuit-session's dev-deps pam-sys).
#
# `relative = true` is stable in `[env]` (cargo 1.74+) and
# resolves the value against this config file's directory — i.e.
# the workspace root — so the path stays correct no matter which
# crate directory cargo is invoked from.
#
# Regenerate the bindings file with `just regenerate-decoder-bindings`
# when the workspace's ffmpeg-headless pin changes.
[env]
FFMPEG_BINDING_PATH = { value = "crates/halmasuit-decoder/ffmpeg_binding.rs", relative = true }
