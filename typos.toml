# typos configuration. Run via `typos` (in nix devshell).
# https://github.com/crate-ci/typos

[default]
extend-ignore-identifiers-re = []

[default.extend-words]
# Project-specific allow list grows here when typos misfires.
halmasuit = "halmasuit"
# /proc/<pid>/status capability-set field names (CapInh = inheritable).
# typos thinks "Inh" should be "In".
Inh = "Inh"
CapInh = "CapInh"

[files]
extend-exclude = [
    "target/",
    "result*",
    "*.lock",
]
