# typos configuration. Run via `typos` (in nix devshell).
# https://github.com/crate-ci/typos

[default]
# typos parses "PNGs" as the identifier "PN" + "Gs", so the `PN → ON`
# rule mis-fires. Same story for "OTPs" (split into "OT" + "Ps"). Match
# the full token.
extend-ignore-identifiers-re = ["^PNGs$", "^OTPs$"]

[default.extend-words]
# Project-specific allow list grows here when typos misfires.
halmasuit = "halmasuit"
# /proc/<pid>/status capability-set field names (CapInh = inheritable).
# typos thinks "Inh" should be "In".
Inh = "Inh"
CapInh = "CapInh"
# Plural of PNG. typos rewrites "PNGs" → "PONs".
PNGs = "PNGs"
# Plural of OTP (One-Time Password). typos parses "OTPs" as "OT" + "Ps"
# and suggests "TOPs/OFPs/...". Same shape as the PNGs case above.
OTPs = "OTPs"
# Level Of Detail — standard graphics term used in
# crates/kushuh/ARCHITECTURE.md's distant-star LOD discussion.
# typos suggests "LOAD".
LOD = "LOD"
# Simon Ser, sway/wlroots maintainer, referenced by surname in
# crates/kushuh/ARCHITECTURE.md. typos suggests "Set".
Ser = "Ser"

[files]
extend-exclude = [
    "target/",
    "result*",
    "*.lock",
    # Auto-generated FFmpeg bindings (rusty_ffmpeg's binding.rs,
    # checked in to keep production bindgen-free per Epic #12 task
    # #28). Contains FFmpeg API identifiers like "MaxCLL" (max
    # content light level) that typos misreads.
    "crates/halmasuit-decoder/ffmpeg_binding.rs",
]
