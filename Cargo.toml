[workspace]
resolver = "3"
members = [
    "crates/halmasuit",
    "crates/halmasuit-protocols",
    "crates/halmasuit-introspect",
    "crates/halmasuit-greetd",
    "crates/halmasuit-pam",
    "crates/halmasuit-ipc",
    "crates/halmasuit-cli",
    "crates/halmasuit-spawn",
    "crates/halmasuit-test",
    "crates/halmasuit-vm-client",
    # Research probe — not v2 production. See RESEARCH.md.
    "crates/drm-master-probe",
    # Layer-shell test client — throwaway, used by
    # tests/visual-halmasuit-layer.nix to verify halmasuit composites
    # wl_clients via wlr-layer-shell.
    "crates/halmasuit-layer-shell-test-client",
    # halmasuit-splash — the real system background wl_client (wgpu,
    # PNG-as-texture, layer-shell BACKGROUND). Epic layer C.
    "crates/halmasuit-splash",
    # Throwaway xdg_toplevel test client — exercises halmasuit's F1
    # xdg-shell compositing path.
    "crates/halmasuit-toplevel-test-client",
    "xtask",
]
# cargo-fuzz subworkspace needs nightly rustc + libfuzzer-sys; isolated
# from the main workspace which pins stable 1.95.
exclude = ["crates/halmasuit-spawn/fuzz"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.95"
# Dual-licensed per Rust ecosystem convention. The decision to re-derive
# the greetd protocol locally (rather than depend on upstream `greetd_ipc`,
# which is GPL-3.0-only) keeps halmasuit's binary distributable under
# permissive terms. See halmasuit-greetd/src/lib.rs for the protocol-
# source citation and the clean-room reimplementation rationale.
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/joshsymonds/halmasuit"
authors       = ["Josh Symonds <veraticus@gmail.com>"]

[workspace.dependencies]
# `thiserror` for error enums that benefit from Display derives. Used
# by halmasuit-greetd's StateMachineError.
thiserror          = "2"
# PAM FFI for halmasuit-pam. Direct thin FFI (no wrapper crate) per
# ARCHITECTURE.md "Open decisions" row 1 — wrappers flatten PAM's
# message-style enum that our AuthMessageType already mirrors.
#
# NOTE: 1.0.0-alpha5 is a pre-release (last released 2023-11) at a
# privilege-critical FFI boundary. The crate has shipped alphas for
# years and downstream consumers (the `pam` and `pam-client` wrapper
# crates) pin to this exact version, so it is de-facto stable. Track
# upstream (https://github.com/1wilkens/pam-sys) and RustSec for
# advisories before each release tag; if a stable 1.0 ships, update
# the pin and re-audit any signature changes (esp. pam_conv).
pam-sys            = "1.0.0-alpha5"
# C types and constants for the halmasuit-pam FFI surface.
libc               = "0.2"
# Zero-on-drop for password buffers handed back to PAM. Used by the
# conv-callback bridge to wipe response strings after libc::strdup
# copies them into PAM-owned memory.
zeroize            = "1"
# Shared across crates that emit or consume introspection events.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
# Per-test tempdirs for integration tests that spawn binaries needing
# XDG_RUNTIME_DIR or similar isolation.
tempfile           = "3"
# D-Bus for the test-only `org.halmasuit.Debug.Introspect.Snapshot`
# method. zbus 5.x per CLAUDE.md. Default features only — that uses
# the bundled `async-io` executor, NOT tokio and NOT glib (CLAUDE.md
# forbids glib). Pulled in ONLY by halmasuit's `frame_audit` feature
# (optional dep); the production binary never links it.
zbus               = "5"
# PNG encoder for `Snapshot()`. Deliberately the small `png` crate,
# NOT the `image` crate — Epic #1 req 7 forbids `image` in the
# production cargo-tree, and we keep it out of the debug tree too.
# `frame_audit`-gated optional dep.
png                = "0.17"
# Smithay — Rust Wayland compositor toolkit. Pinned to niri's current
# commit (matching their Cargo.toml workspace dep). default-features
# disabled so each consumer crate picks only what it needs.
smithay            = { version = "0.7", git = "https://github.com/Smithay/smithay.git", rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef", default-features = false }
# Calloop is pinned at the same 0.14.x line smithay uses; we pull it in
# directly (in addition to smithay's reexport) only to opt into the
# `signals` feature, which smithay itself doesn't enable. Cargo unifies
# to a single version with merged features.
calloop            = { version = "0.14", features = ["signals"] }
# POSIX bindings. drm-master-probe has its own entry (different feature set);
# this entry is for v2 production crates that need signal/kill/etc.
nix                = "0.30"
# Linux capability(7) primitives — capset, securebits::set_keepcaps —
# used by halmasuit's drop_privileges to retain CAP_KILL across the
# in-process setresuid. Pure-Rust over libc syscalls; no C deps.
caps               = "0.5"
# Property-based testing. halmasuit-spawn argv parser + the future greetd
# state machine both lean on it for boundary-condition coverage.
proptest           = "1"
# halmasuit-splash (the system background wl_client) deps. NOT used by
# the halmasuit compositor binary — these never enter halmasuit's
# cargo-tree (Epic #1 req 7 is about halmasuit, not its sibling
# clients). `image` here is fine for the same reason.
# - wgpu: GPU surface + textured fullscreen quad. GL backend in-VM
#   (Mesa/llvmpipe, already wired by nix/module.nix).
# - raw-window-handle 0.6: bridge wayland-client's wl_surface/
#   wl_display pointers into wgpu (matches wgpu 22's RWH major).
# - image: decode the splash PNG. default features (incl. png).
# - pollster: block_on for wgpu's async adapter/device init.
wgpu               = "22"
raw-window-handle  = "0.6"
image              = { version = "0.25", default-features = false, features = ["png"] }
pollster           = "0.3"
# Direct wayland-client (in addition to sctk's re-export, same crate
# via unification) ONLY to turn on the system libwayland backend:
# `dlopen` → `wayland-backend/dlopen` → `client_system`, which is what
# exposes the raw `wl_display`/`wl_surface` pointers wgpu's wayland
# WSI needs. Without it sctk uses the pure-Rust backend (no C
# pointers) and wgpu cannot create a surface.
# `system` → wayland-backend/client_system (the sys ObjectId/Backend
# that expose `as_ptr`/`display_ptr`); `dlopen` → load libwayland at
# runtime instead of link-time (matches how Mesa/wgpu load it).
wayland-client     = { version = "0.31", features = [ "dlopen", "system" ] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
# Targeted allows for lints that produce noise without catching real bugs in
# this codebase's idiom. Re-evaluate periodically.
module_name_repetitions = "allow"
similar_names           = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"  # currently permitted; deny.toml has bans.multiple-versions = "warn" (non-failing). Tighten both when real deps land.
cargo_common_metadata   = "allow"  # not publishing to crates.io; metadata fields like keywords/categories aren't relevant.
doc_markdown            = "allow"  # we'll backtick-discipline as real APIs land; placeholder docs are too noisy.

[workspace.lints.rust]
unsafe_code = "warn"  # crates that need it opt in via #![allow] with justification.

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = "full"
