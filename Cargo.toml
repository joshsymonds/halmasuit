[workspace]
resolver = "3"
members = [
    "crates/halmasuit",
    "crates/halmasuit-protocols",
    "crates/halmasuit-introspect",
    "crates/halmasuit-greetd",
    "crates/halmasuit-ipc",
    "crates/halmasuit-cli",
    "crates/halmasuit-spawn",
    "crates/halmasuit-test",
    # Research probe — not v2 production. See RESEARCH.md.
    "crates/drm-master-probe",
    "xtask",
]
# cargo-fuzz subworkspace needs nightly rustc + libfuzzer-sys; isolated
# from the main workspace which pins stable 1.95.
exclude = ["crates/halmasuit-spawn/fuzz"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.95"
license       = "Apache-2.0"
repository    = "https://github.com/joshsymonds/halmasuit"
authors       = ["Josh Symonds <veraticus@gmail.com>"]

[workspace.dependencies]
# Shared across crates that emit or consume introspection events.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
# Smithay's event loop. halmasuit's spine reuses this from main() onward.
calloop            = { version = "0.14", features = ["signals"] }
# POSIX bindings. drm-master-probe has its own entry (different feature set);
# this entry is for v2 production crates that need signal/kill/etc.
nix                = "0.30"
# Property-based testing. halmasuit-spawn argv parser + the future greetd
# state machine both lean on it for boundary-condition coverage.
proptest           = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
# Targeted allows for lints that produce noise without catching real bugs in
# this codebase's idiom. Re-evaluate periodically.
module_name_repetitions = "allow"
similar_names           = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"  # currently permitted; deny.toml has bans.multiple-versions = "warn" (non-failing). Tighten both when real deps land.
cargo_common_metadata   = "allow"  # not publishing to crates.io; metadata fields like keywords/categories aren't relevant.
doc_markdown            = "allow"  # we'll backtick-discipline as real APIs land; placeholder docs are too noisy.

[workspace.lints.rust]
unsafe_code = "warn"  # crates that need it opt in via #![allow] with justification.

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = "full"
